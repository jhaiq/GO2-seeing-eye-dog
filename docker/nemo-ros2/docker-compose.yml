services:
  nemo-ros2:
    build:
      context: .
      dockerfile: Dockerfile
    image: nemo-ros2:latest
    container_name: nemo-ros2
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${HOST_WORKSPACE:-../..}:/home/${USERNAME:-developer}/workspace
      - ${HOST_ROS2_WS:-~/ros2_ws}:/home/${USERNAME:-developer}/ros2_ws
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    user: ${USERNAME:-developer}
    working_dir: /home/${USERNAME:-developer}/workspace/go2_audio_perception
    command: /bin/bash
