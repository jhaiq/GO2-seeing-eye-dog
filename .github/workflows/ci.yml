name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install numpy scipy pytest ruff
      - name: Lint repo
        run: ./scripts/lint.sh

  validate:
    name: Static validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install numpy scipy pytest ruff
      - name: Validate repo contracts
        run: ./scripts/validate.sh

  test:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install numpy scipy pytest
      - name: Run unit tests
        run: ./scripts/test.sh

  build:
    name: Build (AGIROS loong)
    runs-on: ubuntu-22.04
    container:
      # AGIROS loong deployment image (colcon/agirosdep preinstalled). It is
      # hosted on the AGIROS registry; if a runner cannot reach it, build the
      # equivalent environment from docker/agiros-loong/Dockerfile and push it
      # to a registry the runner can pull.
      image: docker.agiros.org.cn/sim/agiros-loong-ubuntu-unitree-sim:2606
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          . /opt/agiros/loong/setup.sh
          apt-get update -q
          apt-get install -y \
            python3-pip \
            portaudio19-dev
          # AGIROS ships agirosdep instead of rosdep; the image preconfigures
          # its package index, so there is no init step.
          agirosdep update
          agirosdep install --from-paths . --ignore-src -r -y --rosdistro loong
          # colcon-core needs setuptools<80; unpinned ultralytics/torch pull in 83+.
          pip install "setuptools<80" "packaging>=23.2" ultralytics opencv-python-headless pyaudio scipy numpy
      - name: Build msgs first, then packages
        run: |
          . /opt/agiros/loong/setup.sh
          colcon build --symlink-install --packages-select go2_msgs
          . install/setup.sh
          colcon build --symlink-install --packages-select \
            go2_audio_perception go2_perception go2_intent_grounding \
            go2_safety_monitor go2_voice_commander go2_navigation \
            go2_bringup go2_gait_controller \
            go2_safety_arbiter go2_hardware_bridge go2_approach_controller

      - name: Run the full suite, including the safety-authority proofs
        run: |
          . /opt/agiros/loong/setup.sh
          . install/setup.sh
          # An isolated domain: these tests assert on what does and does not
          # reach an actuator, so a foreign ROS graph could make them pass or
          # fail for the wrong reason.
          export ROS_DOMAIN_ID=42
          export ROS_LOCALHOST_ONLY=1
          pip install pytest pyyaml
          python3 -m pytest -v
