# Single 8 x 6 m room, walls only plus two objects against the walls.
# For the staged (straight-line, no obstacle avoidance) planner, whose goals
# must be reachable in a straight line. Frame: odom, metres.
start_pose: {x: 1.0, y: 1.0, yaw: 0.0}

obstacles:
  - {label: wall_south, x: 4.0, y: 0.0, size_x: 8.0, size_y: 0.1, height: 1.2}
  - {label: wall_north, x: 4.0, y: 6.0, size_x: 8.0, size_y: 0.1, height: 1.2}
  - {label: wall_west, x: 0.0, y: 3.0, size_x: 0.1, size_y: 6.0, height: 1.2}
  - {label: wall_east, x: 8.0, y: 3.0, size_x: 0.1, size_y: 6.0, height: 1.2}

objects:
  - {label: chair, x: 7.4, y: 1.0, size_x: 0.5, size_y: 0.5, size_z: 0.9}
  - {label: refrigerator, x: 7.4, y: 5.3, size_x: 0.7, size_y: 0.7, size_z: 1.8}
