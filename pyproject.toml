[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/test/*.py" = ["E402"]
"evaluation/tests/*.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = [
  "go2_audio_perception/test",
  "go2_intent_grounding/test",
  "go2_voice_commander/test",
  "go2_safety_arbiter/test",
  "go2_hardware_bridge/test",
  "go2_approach_controller/test",
  "go2_localization/test",
  "go2_bringup/test",
  "evaluation/tests",
]
markers = [
  "ros: requires a live rclpy context and the generated go2_msgs types",
]

